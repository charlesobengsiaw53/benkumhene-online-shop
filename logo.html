<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benkumhene Logo</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, Helvetica, sans-serif;
}

.logo{
    display:flex;
    align-items:center;
    background:white;
    padding:20px 35px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.icon{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#198754;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    margin-right:20px;
}

.text h1{
    margin:0;
    color:#198754;
    font-size:32px;
}

.text p{
    margin-top:8px;
    color:#555;
    font-size:16px;
}

</style>

</head>

<body>

<div class="logo">

<div class="icon">
??
</div>

<div class="text">

<h1>BENKUMHENE</h1>

<p>ONLINE SHOP</p>

</div>

</div>
<script src="script.js"></script>

</body>
</html>
