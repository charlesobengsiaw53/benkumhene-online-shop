<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Benkumhene Online Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(to right,#198754,#ffc107);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:420px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#198754;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    background:#198754;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#146c43;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#198754;
    text-decoration:none;
    font-weight:bold;
}

.logo{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    color:#198754;
    margin-bottom:15px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">BENKUMHENE ONLINE SHOP</div>
<h1>Create Account</h1>
<form id="registerForm">
<label>First Name</label>
<input type="text"  id="regfirstName" placeholder="Enter First Name" required>
<label>Last Name</label>
<input type="text" id="reglastName" placeholder="Enter Last Name" required>
<label>Email Address</label>
<input type="email" id= "regEmail" placeholder="Enter Email Address" required>
<label>Phone Number</label>
<input type="tel" id="regNumber"placeholder="Enter Phone Number" required>
<label>Password</label>
<input type="password" id="regPassword" placeholder="Enter Password" required>
<label>Confirm Password</label>
<input type="password" id="regconfirmPassword" placeholder="Confirm Password" required>
<button type="submit">Register</button>
</form>

<div class="login-link">Already have an account?
<a href="login.html">Login Here</a>
</div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const firstName_V = document.getElementById("regfirstName").value.trim();
    const lastName_V = document.getElementById("reglastName").value.trim();
    const myEmail_V = document.getElementById("regEmail").value.trim();
    const myNumber_V = document.getElementById("regNumber").value.trim();
    const myPassword_V = document.getElementById("regPassword").value;
    const confirmPassword_V = document.getElementById("regconfirmPassword").value;

    if (myPassword_V !== confirmPassword_V) {
        alert("Passwords do not match.");
        return;
    }

    const customer = {
        fName: firstName_V,
        lName: lastName_V,
        email: myEmail_V,
        phone: myNumber_V,
        password: myPassword_V
    };

    localStorage.setItem("custForm", JSON.stringify(customer));

    alert("Registration Successful!");

    window.location.href = "login.html";
let custForm = JSON.parse(localStorage.getItem("custForm")) || [];

});
</script>
</body>
</html>
