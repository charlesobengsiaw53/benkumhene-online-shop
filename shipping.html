<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping Information | Benkumhene Online Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#198754;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

nav a:hover{
    color:#ffc107;
}

.banner{
    background:linear-gradient(to right,#198754,#ffc107);
    color:white;
    text-align:center;
    padding:50px 20px;
}

.banner h1{
    font-size:42px;
}

.banner p{
    margin-top:10px;
    font-size:18px;
}

.container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

h2{
    color:#198754;
    margin-bottom:20px;
}

.form-row{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.form-group{
    flex:1;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

textarea{
    resize:vertical;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 30px;
    border:none;
    border-radius:5px;
    font-size:17px;
    cursor:pointer;
}

.back{
    background:#6c757d;
    color:white;
}

.continue{
    background:#198754;
    color:white;
}

.back:hover{
    background:#5a6268;
}

.continue:hover{
    background:#146c43;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}

@media(max-width:768px){

.form-row{
    flex-direction:column;
}

.buttons{
    flex-direction:column;
    gap:15px;
}

.btn{
    width:100%;
}

}
</style>

</head>




<body>
<header>
<div class="logo">
?? BENKUMHENE ONLINE SHOP
</div>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="cart.html">Cart</a>
<a href="checkout.html">Checkout</a>
</nav>
</header>

<section class="banner">
<h1>Shipping Information</h1>
<p>Enter your delivery details below.</p>
</section>
<div class="container">
<h2>Delivery Address</h2>




<form id="shippingForm">
<div class="form-row">
<div class="form-group">
<label>First Name</label>
<input type="text" id="first-name" placeholder="First Name" required>
</div>

<div class="form-group">
<label>Last Name</label>
<input type="text" id="last-name" placeholder="Last Name" required>
</div>
</div>

<div class="form-row">
<div class="form-group">
<label>Email Address</label>
<input type="email" id="email-address" placeholder="Email Address" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Phone Number" required>
</div>

</div>

<label>Street Address</label>
<input type="text" id="address"  placeholder="House Number, Street Name" required><br><br>

<label>Apartment / Suite (Optional)</label>
<input type="text" id="apartment" placeholder="Apartment, Suite, Unit"><br><br>

<div class="form-row">
<div class="form-group">
<label>City</label>
<input type="text"  id="city" placeholder="City" required>
</div>

<div class="form-group">
<label>State / Region</label>
<input type="text" id="region" placeholder="State or Region">
</div>

</div>

<div class="form-row">
<div class="form-group">
<label >Country</label>
<select id="country">
<option>United States</option>
<option>Ghana</option>
<option>Canada</option>
<option>United Kingdom</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>ZIP / Postal Code</label>
<input type="text" id="postal-code" placeholder="ZIP Code">
</div>
</div>

<label>Delivery Instructions</label>
<textarea rows="5"  id="delivery-instructions"  placeholder="Leave delivery instructions (optional)"></textarea>
<div class="buttons">
<button type="button" class="btn back" onclick="window.location.href='cart.html'">Back to Cart</button>

<button type="submit" class="btn continue">Continue to Payment ?</button>
</div>
</form>
</div>

<footer>
<h2>BENKUMHENE ONLINE SHOP</h2>
<p>Fast Delivery • Secure Shipping • Trusted Service</p>
<p>&copy; 2026 Benkumhene Online Shop. All Rights Reserved.</p>


<script>


document.getElementById("shippingForm").addEventListener("submit", function(e){
    e.preventDefault();



const shipping = {
    fullname:
        document.getElementById("first-name").value + " " +
        document.getElementById("last-name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email-address").value,
    address: document.getElementById("address").value,
    apartment: document.getElementById("apartment").value,
    city: document.getElementById("city").value,
    region: document.getElementById("region").value,
    country: document.getElementById("country").value,
    postalCode: document.getElementById("postal-code").value,
    deliveryInstructions: document.getElementById("delivery-instructions").value,
    date: new Date().toLocaleDateString(),
    status: "Pending",
    payment: "Unpaid"
};

let shippings = JSON.parse(localStorage.getItem("shippings")) || [];
shippings.push(shipping);
localStorage.setItem("shippings", JSON.stringify(shippings));
alert("Shipping Added Successfully!");
document.getElementById("shippingForm").reset();

});
</script>











</footer>
<script src="script.js"></script>
</body>
</html>
