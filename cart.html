<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | Benkumhene Online Shop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#198754;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h2{
    font-size:28px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:1200px;
    margin:40px auto;
}

h1{
    color:#198754;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

th{
    background:#198754;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

img{
    width:80px;
    border-radius:8px;
}

input[type="number"]{
    width:60px;
    padding:6px;
    text-align:center;
}

.remove{
    background:#dc3545;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

.summary{
    margin-top:30px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    text-align:right;
}

.summary h2{
    color:#198754;
}

.checkout{
    margin-top:20px;
    background:#198754;
    color:white;
    border:none;
    padding:15px 30px;
    font-size:18px;
    border-radius:5px;
    cursor:pointer;
}

.checkout:hover{
    background:#146c43;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}
</style>

</head>

<body>

<header>
    <h2>BENKUMHENE ONLINE SHOP</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="checkout.html">Checkout</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="container">

<h1>Shopping Cart</h1>

<table>

<tr>
<th>Product</th>
<th>Name</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
<th>Action</th>
</tr>

<tbody id="cartItems">
</tbody>

</table>



<div class="summary">

    <h2>Order Summary</h2>




<p><strong>Subtotal:</strong><span id="subtotal">$0.00</span></p>
<p><strong>Shipping:</strong><span id="shipping">$5.00</span></p>
<h2>
    Total:
    <span id="total">$0.00</span>
</h2>

<a href="checkout.html"><button class="checkout">Proceed to Checkout</button></a>
</div>
</div>


<script>
// Load cart from localStorage
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Save cart
function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
}

//
// Add product to cart
function addToCart(name, price, image) {

    let item = cart.find(product => product.name === name);

    if (item) {
        item.quantity++;
    } else {
        cart.push({
            name: name,
            price: Number(price),
            image: image,
            quantity: 1
        });
    }

    saveCart();

    alert(name + " added to your cart.");

    updateCartCount();

} 



// Display cart items
function displayCart() {

    const cartTable = document.getElementById("cartItems");
    const subtotalElement = document.getElementById("subtotal");
    const shippingElement = document.getElementById("shipping");
    const totalElement = document.getElementById("total");

    if (!cartTable) return;

    cartTable.innerHTML = "";

    let subtotal = 0;

    cart.forEach((item, index) => {

        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;

        cartTable.innerHTML += `
        <tr>
            <td>
                <img src="${item.image}" width="70">
            </td>

            <td>${item.name}</td>

            <td>$${Number(item.price).toFixed(2)}</td>

            <td>
                <button onclick="decreaseQuantity(${index})">-</button>

                ${item.quantity}

                <button onclick="increaseQuantity(${index})">+</button>
            </td>

            <td>$${itemTotal.toFixed(2)}</td>

            <td>
                <button class="remove" onclick="removeItem(${index})">
                    Remove
                </button>
            </td>
        </tr>
        `;

    });

    const shipping = 5;
    const total = subtotal + shipping;

    subtotalElement.textContent = "$" + subtotal.toFixed(2);
    shippingElement.textContent = "$" + shipping.toFixed(2);
    totalElement.textContent = "$" + total.toFixed(2);

}
 
    

 



// Increase quantity
function increaseQuantity(index) {
    cart[index].quantity++;
    saveCart();
    displayCart();
    updateCartCount();
}

// Decrease quantity
function decreaseQuantity(index) {

    if (cart[index].quantity > 1) {
        cart[index].quantity--;
    } else {
        cart.splice(index, 1);
    }

    saveCart();
    displayCart();
    updateCartCount();
}

// Remove an item
function removeItem(index) {
    cart.splice(index, 1);
    saveCart();
    displayCart();
    updateCartCount();
}



// Clear the entire cart
function clearCart() {

    if (cart.length === 0) {
        alert("Your cart is already empty.");
        return;
    }

    if (confirm("Are you sure you want to clear your cart?")) {
        cart = [];
        saveCart();
        displayCart();
        updateCartCount();
    }
}

// Update cart item count
function updateCartCount() {

    const cartCount = document.getElementById("cartCount");

    if (!cartCount) return;

    let count = 0;

    cart.forEach(item => {
        count += item.quantity;
    });

    cartCount.textContent = count;
}

// Initialize the cart page
document.addEventListener("DOMContentLoaded", () => {
    displayCart();
    updateCartCount();
});
</script>
<footer>

<p>&copy; 2026 Benkumhene Online Shop. All Rights Reserved.</p>

</footer>
<script src="script.js"></script>

</body>
</html>
