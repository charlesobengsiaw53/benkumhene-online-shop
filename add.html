<!DOCTYPE html>
<html lang="en">

<head>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="add_CSS.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product | Benkumhene Online Shop</title>
</head>

<body>
   <div class="container">
<header>
<div class="logo">BENKUMHENE ONLINE SHOP</div>
<nav>
<a href="index.html">Home</a>
<a href="kente.html">Kente Shop</a>
<a href="herbal.html">Herbal Shop</a>
<a href="adminlogin.html">Admin</a>
</nav>
</header>


<div class="container">
<h1>Add New Product</h1>
<form id="productForm">

<label for="productId">Product ID</label>
<input type="text" id="productId" placeholder="Enter Product ID (e.g. BK001)" required>

<label>Category</label>
<select id="category" required>
    <option value="">Select Category</option>
    <option value="Kente">Kente</option>
    <option value="Bags">Bags</option>
    <option value="Shoes">Shoes</option>
    <option value="Clothing">Clothing</option>
    <option value="Herbal">Herbal Products</option>
    <option value="Jewelry">Jewelry</option>
    <option value="Cosmetics">Cosmetics</option>
    <option value="Food">Food Items</option>
    <option value="Accessories">Accessories</option>
</select>

<label>Name</label>
<input type="text" id="name" placeholder="Product Name" required>
<label>Price</label>

<input type="number" id="price" min="0" step="0.01" placeholder="Price" required>

<label>Description</label>
<textarea id="description" rows="4" placeholder="Enter product description"></textarea>
<label>Stock Quantity</label>
<input type="number" id="stock" min="0" placeholder="Available quantity" required>
<label>Select Product Image</label>
<input type="file" id="image" accept="image/*" required>
<img id="preview" style="display:none;width:200px;height:200px;object-fit:cover;border:1px solid #ccc;border-radius:8px;">
<button class="btn" type="submit">Add Product</button>
</form>
</div>
<script>

const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");
let imageData = "";

// Preview image
imageInput.addEventListener("change", function () {
    const file = this.files[0];

    if(file){
        const reader = new FileReader();
         reader.onload = function(e){
            imageData = e.target.result;
            preview.src = imageData;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    }
});

document.getElementById("productForm").addEventListener("submit", function(e){
    e.preventDefault();

if (imageData === "") {
    alert("Please select a product image.");
    return;
}

const product = {

    id: document.getElementById("productId").value.trim(),
    category: document.getElementById("category").value,
    name: document.getElementById("name").value,
    price: parseFloat(document.getElementById("price").value),
    description: document.getElementById("description").value,
    stock: parseInt(document.getElementById("stock").value),
    image: imageData
};

let products = JSON.parse(localStorage.getItem("products")) || [];

// Check whether the Product ID already exists
if (products.some(p => p.id === product.id)) {
    alert("Product ID already exists.");
    return;
}
products.push(product);
localStorage.setItem("products", JSON.stringify(products));


alert("Product Added Successfully!");
this.reset();
imageInput.value = "";
preview.src = "";
preview.style.display = "none";
imageData = "";
});
</script>

<footer>
<h2>BENKUMHENE ONLINE SHOP</h2>
<p>Admin Product Management</p>
<p>Benkumhene Online Shop. All Rights Reserved</p>
</footer>
   </div>
</body>
</html>
