<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Messages | Benkumhene Online Shop</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#198754;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:95%;
    max-width:1300px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#198754;
    color:white;
    padding:12px;
}

td{
    border-bottom:1px solid #ddd;
    padding:12px;
    text-align:center;
    vertical-align:top;
}

.message{
    text-align:left;
}

.reply{
    text-align:left;
    color:green;
    font-weight:bold;
}

.waiting{
    color:red;
    font-style:italic;
}

button{
    padding:8px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#198754;
    color:white;
}

</style>

</head>

<body>

<header>

<h1>BENKUMHENE ONLINE SHOP</h1>

<h2>My Messages</h2>

</header>

<div class="container">

<table>

<thead>

<tr>

<th>No.</th>

<th>Subject</th>

<th>Your Message</th>

<th>Administrator Reply</th>

<th>Reply Date</th>

<th>Status</th>

</tr>

</thead>

<tbody id="messageTable">

</tbody>

</table>

</div>

<script>

const table=document.getElementById("messageTable");

let messages=
JSON.parse(localStorage.getItem("messages")) || [];

/* Replace this with the logged-in customer's email */
const customerEmail=
localStorage.getItem("loggedInEmail");

let number=1;

messages.forEach(msg=>{

if(msg.email===customerEmail){

table.innerHTML+=`

<tr>

<td>${number++}</td>

<td>${msg.subject}</td>

<td class="message">${msg.message}</td>

<td class="reply">

${msg.reply ? msg.reply : "<span class='waiting'>No reply yet.</span>"}

</td>

<td>

${msg.replyDate ? msg.replyDate : "-"}

</td>

<td>

${msg.replyStatus ? msg.replyStatus : "Waiting"}

</td>

</tr>

`;

}

});

</script>

</body>

</html>
