<!-- Message Modal -->

<script>

const modal = document.getElementById("messageModal");
const close = document.querySelector(".close");

close.onclick = function () {
    modal.style.display = "none";
};

window.onclick = function (event) {
    if (event.target === modal) {
        modal.style.display = "none";
    }
};


const table = document.getElementById("messageTable");
let messages = JSON.parse(localStorage.getItem("messages")) || [];

table.innerHTML = "";

messages.forEach((msg, index) => {

    table.innerHTML += `
    <tr>
        <td>${index + 1}</td>
        <td>${msg.customer}</td>
        <td>${msg.subject}</td>
        <td>${msg.email}</td>
        <td>${msg.date}</td>
        <td>${msg.status}</td>

        <td>
            <button class="view" onclick="viewMessage(${index})">
                View
            </button>
        </td>

        <td>
            <button class="reply" onclick="replyMessage(${index})">Reply </button>
        </td>

        <td>
            <button class="delete" onclick="deleteMessage(${index})">Delete</button>
        </td>
    </tr>
    `;
});


function viewMessage(index){

    let messages = JSON.parse(localStorage.getItem("messages")) || [];
    let msg = messages[index];

    document.getElementById("customerName").innerHTML = msg.customer;
    document.getElementById("customerEmail").innerHTML = msg.email;
    document.getElementById("customerSubject").innerHTML = msg.subject;
    document.getElementById("customerMessage").innerHTML = msg.message;

    modal.style.display = "block";
}


function deleteMessage(index){

    let messages = JSON.parse(localStorage.getItem("messages")) || [];

    if(confirm("Delete this message?")){

        messages.splice(index,1);

        localStorage.setItem("messages", JSON.stringify(messages));

        location.reload();
    }
}

function replyMessage(index){

    localStorage.setItem("selectedMessage", index);

    viewMessage(index);

}


function sendReply() {

    // Get the reply typed by the admin
    const replyText = document.getElementById("reply").value.trim();

    if (replyText === "") {
        alert("Please type your reply.");
        return;
    }

    // Selected customer message
    const index = localStorage.getItem("selectedMessage");

    // Read stored data
    let messages = JSON.parse(localStorage.getItem("messages")) || [];
    let replies = JSON.parse(localStorage.getItem("replies")) || [];

    // Current customer message
    const msg = messages[index];

    // Customer phone number
    let phone = msg.phone || "";

    // Convert Ghana numbers to international format
    phone = phone.replace(/\s+/g, "");

    if (phone.startsWith("0")) {
        phone = "233" + phone.substring(1);
    }

    // Save reply for customer's account
    replies.push({
        customer: msg.customer,
        email: msg.email,
        phone: msg.phone,
        subject: msg.subject,
        message: msg.message,
        reply: replyText,
        date: new Date().toLocaleString(),
        status: "Unread"
    });

    localStorage.setItem("replies", JSON.stringify(replies));

    // Update original message
    messages[index].reply = replyText;
    messages[index].replyDate = new Date().toLocaleString();
    messages[index].replyStatus = "Replied";
    messages[index].status = "Read";

    localStorage.setItem("messages", JSON.stringify(messages));

    // Send through WhatsApp if a phone number exists
    if (phone !== "") {
        window.open(
            `https://wa.me/${phone}?text=${encodeURIComponent(replyText)}`,
            "_blank"
        );
    }

    alert("Reply sent successfully.");

    // Clear reply box
    document.getElementById("reply").value = "";

    // Close the modal
    document.getElementById("messageModal").style.display = "none";

    // Refresh the table so the new status appears
    location.reload();
}

function emailReply() {

    const index = localStorage.getItem("selectedMessage");
    let messages = JSON.parse(localStorage.getItem("messages")) || [];

    const customerEmail = messages[index].email;
    const reply = document.getElementById("reply").value.trim();

    if (reply === "") {
        alert("Please type your reply.");
        return;
    }

    const subject = "Reply from Benkumhene Online Shop";

    window.open(
        `mailto:${customerEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(reply)}`,
        "_self"

}

async function generateAIReply() {

    const customerMessage =
        document.getElementById("message").textContent;

    const replyBox =
        document.getElementById("reply");

    replyBox.value = "Generating AI reply...";

    try {

        const response = await fetch("YOUR_PHP_FILE.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: customerMessage
            })
        });

        const data = await response.json();

        replyBox.value = data.reply;

    } catch (error) {
