<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Benkumhene Online Shop</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#198754,#145c32,#ffc107);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-box{
    width:420px;
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.logo{
    text-align:center;
    font-size:30px;
    color:#198754;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    background:#198754;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#146c43;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#198754;
    text-decoration:none;
    font-weight:bold;
}

.links a:hover{
    text-decoration:underline;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#777;
    font-size:14px;
}

</style>

</head>

<body>
<div class="login-box">
<div class="logo">BENKUMHENE ADMIN</div>
<p class="subtitle">
Administrator Login Portal
</p>

<form id="loginForm">
<label>Administrator Email</label>
<input type="email" id="regEmail" placeholder="Enter admin email" required>
<label>Password</label>
<input type="password" id="regPassword" placeholder="Enter password" required>
<button type="submit">Login</button>
</form>
<div class="links">
<p><a href="#">Forgot Password?</a></p>
<br>
<p>
<a href="index.html">? Return to Website</a>
<a href="inventory.html">Inventory</a>
</p>


<script>
const savedAccount = JSON.parse(localStorage.getItem("custForm"));
const loginForm = document.getElementById("loginForm");

const myEmail_V = document.getElementById("regEmail");
const myPassword_V = document.getElementById("regPassword");

loginForm.addEventListener("submit", function(e){

    e.preventDefault();
console.log(localStorage);
console.log(localStorage.getItem("custForm"));

    if(savedAccount === null){
        alert("No account found. Please register first.");
        window.location.href = "adminregister.html";
        return;
    }
    if(
        myEmail_V.value === savedAccount.email &&
        myPassword_V.value === savedAccount.password
    ){

        alert("Login Successful");
        window.location.href = "admin.html";

    }else{
        alert("Invalid Email or Password");

    }
});
</script>






</div>
<div class="footer">© 2026 Benkumhene Online Shop</div>
</div>
</body>
</html>
